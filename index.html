Q(['الشخص اللي بيرتكب الاختراق اسمه المخترق (Cracker).','The person who commits cracking is called a Cracker.'],TF,0,['صح، والاختراق هو الوصول غير القانوني لنظام للتلاعب بالبيانات أو محوها أو سرقتها.','True. Cracking is illegally accessing a system to tamper with, erase or steal data.']),
Q(['استخدام هوية وكلمة مرور شخص آخر للدخول على كمبيوتر يعتبر:','Using another person identity and password to access a computer is:'],[['وصول غير مصرح به (جريمة إلكترونية)','Unauthorized access (a cybercrime)'],['استخدام مسموح','Allowed use'],['تحديث للنظام','A system update']],0,['ده انتهاك لقانون الوصول غير المصرح به.','This violates the unauthorized-access law.']),
Q(['أي مما يلي من الجرائم القائمة على الشبكة؟','Which of these is a network-based crime?'],[['الاحتيال والتشهير وانتهاك حقوق المؤلف','Fraud, defamation, copyright infringement'],['تحديث نظام التشغيل','Updating the operating system'],['عمل نسخة احتياطية','Making a backup']],0,['الاحتيال والتشهير وانتهاك حقوق المؤلف جرائم قائمة على الشبكة.','Fraud, defamation and copyright infringement are network-based crimes.']),
Q(['البرمجيات الخبيثة (Malware) يمكن أن تنتقل عبر:','Malware can spread through:'],[['مواقع الويب ومرفقات البريد ومحركات USB','Websites, email attachments, USB drives'],['الكهرباء فقط','Electricity only'],['لا يمكن أن تنتقل','It cannot spread']],0,['دي طرق الإصابة المعروفة، علشان كده نحذر من الروابط والمرفقات و USB.','These are the known infection routes, so be careful with links, attachments and USB drives.']),
Q(['برنامج متنكر كبرنامج شرعي ويتسلل للنظام ويبدأ الهجمات بهدوء هو:','A program disguised as a legitimate one that sneaks in and attacks quietly is a:'],[['حصان طروادة','Trojan horse'],['دودة','Worm'],['برنامج فدية','Ransomware']],0,['حصان طروادة = تنكّر + تسلل.','Trojan horse = disguise + infiltration.']),
Q(['برنامج بينسخ نفسه وينتشر عبر الإنترنت هو:','A program that copies itself and spreads over the Internet is a:'],[['دودة','Worm'],['حصان طروادة','Trojan horse'],['Adware','Adware']],0,['الدودة بتنسخ نفسها وتنتشر لوحدها.','A worm copies itself and spreads on its own.']),
Q(['مسجل لوحة المفاتيح (Keylogger) هو نوع من:','A Keylogger is a type of:'],[['برامج التجسس','Spyware'],['الدودة','Worm'],['الفيروس','Virus']],0,['Keylogger بيسجل ضغطات المفاتيح ويبعتها لطرف ثالث = تجسس.','A keylogger records keystrokes and sends them to a third party = spyware.']),
Q(['برنامج يجعل بياناتك غير قابلة للوصول ويطالب بفدية لاستعادتها هو:','A program that makes your data inaccessible and demands a ransom is:'],[['Ransomware','Ransomware'],['Adware','Adware'],['Keylogger','Keylogger']],0,['Ransomware = برنامج الفدية.','Ransomware = ransom software.']),
Q(['حمّلت برنامج «تعديل صور مجاني» وبعدها موبايلك بدأ يبعت جهات اتصالك لجهة مجهولة. إيه النوع؟ وليه مش دودة؟','You installed a "free photo editor" and your phone started sending your contacts to an unknown party. Which type, and why is it not a worm?'],[['حصان طروادة — متنكر في شكل برنامج مفيد ومبينسخش نفسه','Trojan horse — disguised as a useful app and it does not copy itself'],['دودة — لأنه بيتنقل عبر الإنترنت','Worm — because it spreads over the Internet'],['فيروس — لأنه بيمسح الملفات','Virus — because it erases files']],0,['البرنامج اتنكّر في شكل تطبيق مفيد (طروادة)، والدودة لازم تنسخ نفسها وتنتشر.','The app disguised itself as useful (Trojan); a worm must copy itself and spread.']),
Q(['برنامج الإعلانات (Adware) بيعرض إعلانات غير مرغوبة.','Adware shows unwanted advertisements.'],TF,0,['صح، وهو من أنواع برامج التجسس حسب الكتاب.','True, and the book lists it under spyware.'])

qs:[

Q(['ليه استخدام تاريخ الميلاد كباسورد فكرة سيئة؟','Why is using your birth date as a password a bad idea?'],[['لأنه معلومة شخصية يسهل تخمينها','Because it is personal info that is easy to guess'],['لأنه طويل جدًا','Because it is too long'],['لأنه مش أرقام','Because it is not numbers']],0,['من الإرشادات: متستخدمش معلومات شخصية.','One guideline: never use personal information.']),

Q(['المصادقة هي:','Authentication is:'],[['التحقق من هوية المستخدم على كمبيوتر أو شبكة','Verifying a user identity on a computer or network'],['تشفير الملفات','Encrypting files'],['حذف الفيروسات','Removing viruses']],0,['المصادقة = التحقق من الهوية.','Authentication = identity verification.']),
Q(['كلمة المرور و PIN من أنواع المصادقة القائمة على:','A password and a PIN are authentication based on:'],[['المعرفة (شيء تعرفه)','Knowledge (something you know)'],['الامتلاك','Possession'],['السمات الحيوية','Biometrics']],0,['بنعرفها ونحفظها في دماغنا.','We know and remember them.']),
Q(['البطاقة البنكية والهاتف من أنواع المصادقة القائمة على:','A bank card and a phone are authentication based on:'],[['الامتلاك (شيء تملكه)','Possession (something you have)'],['المعرفة','Knowledge'],['السمات الحيوية','Biometrics']],0,['بنملكها فعليًا.','We physically possess them.']),
Q(['بصمة الإصبع والتعرف على الوجه من أنواع المصادقة القائمة على:','Fingerprint and face recognition are authentication based on:'],[['السمات الحيوية (شيء أنت عليه)','Biometrics (something you are)'],['المعرفة','Knowledge'],['الامتلاك','Possession']],0,['دي صفات في جسمك.','These are traits of your body.']),
Q(['المصادقة الثنائية هي:','Two-factor authentication is:'],[['الجمع بين نوعين من أنواع المصادقة','Combining two types of authentication'],['كتابة الباسورد مرتين','Typing the password twice'],['استخدام حسابين','Using two accounts']],0,['نوعين مختلفين لحماية أقوى.','Two different types for stronger protection.']),

Q(['أي إجراء مما يلي لا يحميك من الفيروسات؟','Which of these does NOT protect you from viruses?'],[['فتح مرفقات من مرسل مجهول','Opening attachments from an unknown sender'],['تحديث برنامج مكافحة الفيروسات','Updating your antivirus'],['فحص أجهزة USB','Scanning USB drives']],0,['المرفقات المجهولة من أشهر طرق الإصابة.','Unknown attachments are a common infection route.']),

Q(['SSL/TLS بتستخدم مفتاح الجلسة (Session Key).','SSL/TLS uses a session key.'],TF,0,['صح، مفتاح مؤقت لكل اتصال.','True, a temporary key for each connection.']),
Q(['التوقيع الرقمي بيعتمد على:','A digital signature relies on:'],[['التشفير بالمفتاح العام وقيم التجزئة','Public-key encryption and hash values'],['الكتابة بخط اليد','Handwriting'],['الألوان','Colors']],0,['تشفير + تجزئة.','Encryption + hashing.']),
Q(['التوقيع الرقمي بيخفي محتوى الرسالة عن الجميع.','A digital signature hides the message content from everyone.'],TF,1,['غلط، هدفه التحقق من الهوية والسلامة، مش إخفاء المحتوى (ده شغل التشفير).','False, its goal is verifying identity and integrity, not hiding content (that is encryption job).'])
]}
];

/* ====== state ====== */
let lang='ar',theme='',page='home',mode='read',prog={},qz=null;
try{lang=localStorage.getItem('u3l')||'ar'}catch(e){}
try{theme=localStorage.getItem('u3t')||''}catch(e){}
try{prog=JSON.parse(localStorage.getItem('u3p')||'{}')||{}}catch(e){prog={}}
const t=x=>x[lang==='ar'?0:1],s=k=>S[lang][k];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const save=()=>{try{localStorage.setItem('u3p',JSON.stringify(prog))}catch(e){}};
const ltitle=l=>s('lesson')+' '+l.no+': '+t(l.n);

/* ====== quiz engine ====== */
function setOrd(){const q=qz.list[qz.i];qz.ord=q?(q.o===TF?q.o.map((_,k)=>k):shuf(q.o.map((_,k)=>k))):[]}
function newQuiz(key,list){qz={key,list:shuf(list),i:0,sel:null,score:0,wrong:[],ord:[]};setOrd()}
function pick(k){if(!qz||qz.sel!==null)return;const q=qz.list[qz.i];qz.sel=k;if(k===q.a)qz.score++;else qz.wrong.push(q);render()}
function nextQ(){qz.i++;qz.sel=null;setOrd();if(qz.i>=qz.list.length){const o=prog[qz.key];prog[qz.key]={best:Math.max(o?o.best:0,qz.score),total:qz.list.length};save()}render();const b=$('#qbox');if(b)b.scrollIntoView({behavior:'smooth',block:'start'})}
function finalList(){let a=[];LS.forEach(l=>{a=a.concat(shuf(l.qs).slice(0,6))});return a}
function startLesson(i){page='l'+i;mode='quiz';if(!qz||qz.key!==page)newQuiz(page,LS[i].qs);render();scrollTo({top:0,behavior:'smooth'})}
function retry(){if(qz.key==='final')newQuiz('final',finalList());else newQuiz(qz.key,LS[+qz.key.slice(1)].qs);render();scrollTo({top:0,behavior:'smooth'})}
function startFinal(){newQuiz('final',finalList());render();scrollTo({top:0,behavior:'smooth'})}
function setMode(m){mode=m;render();scrollTo({top:0,behavior:'smooth'})}
function go(p){page=p;mode='read';qz=null;render();scrollTo({top:0,behavior:'smooth'})}
function setLang(){lang=lang==='ar'?'en':'ar';try{localStorage.setItem('u3l',lang)}catch(e){}render()}
function toggleTheme(){const dark=theme?theme==='dark':!matchMedia('(prefers-color-scheme:light)').matches;theme=dark?'light':'dark';try{localStorage.setItem('u3t',theme)}catch(e){}render()}

/* ====== views ====== */
function quizView(){
 const n=qz.list.length;if(qz.i>=n)return result();
 const q=qz.list[qz.i],d=qz.sel!==null,LT=lang==='ar'?['أ','ب','ج','د']:['A','B','C','D'];
 return `<div class="card qc"><div class="meta"><span>${s('q')} ${qz.i+1} / ${n}</span><span>✅ ${qz.score}</span></div><div class="pb"><i style="width:${qz.i/n*100}%"></i></div><div class="qt">${t(q.q)}</div><div class="os">${qz.ord.map((k,j)=>`<button class="o ${d?(k===q.a?'ok':qz.sel===k?'bad':''):''}" ${d?'disabled':''} onclick="pick(${k})"><b>${LT[j]}</b><span>${t(q.o[k])}</span></button>`).join('')}</div>${d?`<div class="ex ${qz.sel===q.a?'':'no'}">${qz.sel===q.a?'✅ '+s('right'):'❌ '+s('wrong')}<br>${t(q.x)}</div><div class="nx"><button class="btn" onclick="nextQ()">${qz.i<n-1?s('nextq'):s('res')}</button></div>`:''}</div>`}
function result(){
 const n=qz.list.length,sc=qz.score,p=sc/n,msg=p>=.9?s('m1'):p>=.7?s('m2'):s('m3'),key=qz.key,isF=key==='final',i=isF?-1:+key.slice(1);
 let btns=`<button class="btn" onclick="retry()">${s('retry')}</button>`;
 if(!isF){btns+=`<button class="btn ghost" onclick="setMode('read')">${s('backr')}</button>`;btns+=i<LS.length-1?`<button class="btn" onclick="go('l${i+1}')">${s('nextl')}</button>`:`<button class="btn" onclick="go('final')">${s('toexam')}</button>`}else btns+=`<button class="btn ghost" onclick="go('home')">${s('tohome')}</button>`;
 return `<div class="card res"><div class="big grad">${sc} / ${n}</div><h2>${msg}</h2><div class="dim">${s('best')}: ${prog[key]?prog[key].best:sc} / ${n}</div><div class="nx" style="justify-content:center">${btns}</div></div>`+
 (qz.wrong.length?`<h3>${s('review')}</h3>`+qz.wrong.map(q=>`<div class="wr"><b>${t(q.q)}</b><div class="ca">✔ ${s('correct')}: ${t(q.o[q.a])}</div><div>${t(q.x)}</div></div>`).join(''):'')}
function secCard(c){return `<div class="card sec"><h3><span class="ic">${c.ic}</span><span>${t(c.t)}${lang==='ar'&&c.t[1]&&c.t[1]!==c.t[0]&&!/^\[/.test(c.t[1])?`<small>${c.t[1]}</small>`:''}</span></h3><ul class="pts">${c.pts.map(p=>`<li><span>${t(p)}</span></li>`).join('')}</ul>${c.tip?`<div class="tip">💡 <b>${s('simple')}:</b> ${t(c.tip)}</div>`:''}</div>`}
function lessonPage(i){
 const l=LS[i],k='l'+i;
 const H=`<div class="hero"><span class="pill">${s('lesson')} ${l.no}</span><h2>${l.ic} ${t(l.n)}</h2><div class="dim">${t(l.goal)}</div><div class="seg"><button class="${mode==='read'?'on':''}" onclick="setMode('read')">📖 ${s('read')}</button><button class="${mode==='quiz'?'on':''}" onclick="startLesson(${i})">❓ ${s('qs')} (${l.qs.length})</button></div></div>`;
 if(mode==='quiz'){if(!qz||qz.key!==k)newQuiz(k,l.qs);return H+`<div id="qbox">${quizView()}</div>`}
 return H+`<div class="grid" style="margin-top:14px">${l.secs.map(secCard).join('')}</div><div class="card rec"><h3>${s('rec')}</h3><ul class="pts">${l.rec.map(p=>`<li><span>${t(p)}</span></li>`).join('')}</ul></div><div class="nx"><button class="btn" onclick="startLesson(${i})">${s('startq')}</button></div>`}
function finalPage(){
 if(qz&&qz.key==='final')return `<div class="hero"><span class="pill">🏆 ${s('final')}</span><h2>${s('examt')}</h2></div><div id="qbox">${quizView()}</div>`;
 return `<div class="hero"><span class="pill">🏆 ${s('final')}</span><h2>${s('examt')}</h2><div class="dim">${s('examd')}</div></div><div class="card" style="margin-top:14px">${prog.final?`<div class="dim">${s('best')}: ${prog.final.best} / ${prog.final.total}</div>`:''}<div class="nx"><button class="btn" onclick="startFinal()">${s('startex')}</button></div></div>`}
function homePage(){
 return `<div class="hero"><span class="pill">${s('hp')}</span><h1>${s('ht')}</h1><div class="dim">${s('hs')}</div></div>
 <h3>${s('how')}</h3><div class="steps"><div class="card step"><i>1</i><div><b>${s('h1')}</b><div class="dim" style="font-size:13px;line-height:1.6">${s('h1d')}</div></div></div><div class="card step"><i>2</i><div><b>${s('h2')}</b><div class="dim" style="font-size:13px;line-height:1.6">${s('h2d')}</div></div></div><div class="card step"><i>3</i><div><b>${s('h3')}</b><div class="dim" style="font-size:13px;line-height:1.6">${s('h3d')}</div></div></div></div>
 <h3>${s('lessons')}</h3><div class="grid">${LS.map((l,i)=>{const p=prog['l'+i];return `<div class="card lc" onclick="go('l${i}')"><span class="ic">${l.ic}</span><div><small>${s('lesson')} ${l.no}</small><b>${t(l.n)}</b><small>${l.qs.length} ${s('nq')}${p?' · ✅ '+p.best+'/'+p.total:''}</small></div></div>`}).join('')}<div class="card lc" onclick="go('final')"><span class="ic">🏆</span><div><small>30 ${s('nq')}</small><b>${s('final')}</b>${prog.final?`<small>✅ ${prog.final.best}/${prog.final.total}</small>`:''}</div></div></div><div style="height:30px"></div>`}
function render(){
 const d=document.documentElement;d.lang=lang;d.dir=lang==='ar'?'rtl':'ltr';
 if(theme)d.setAttribute('data-theme',theme);else d.removeAttribute('data-theme');
 document.title=lang==='ar'?'الوحدة الثالثة · أمن المعلومات':'Unit 3 · Information Security';
 $('#brand').textContent='م/ أحمد تامر · '+s('brand');$('#lg').textContent=s('lang');$('#ft').textContent=s('ft');
 let xp=0,dn=0;Object.keys(prog).forEach(k=>{xp+=prog[k].best*10;dn++});
 $('#xp').textContent='⭐ '+xp;$('#bar').style.width=Math.min(100,dn/(LS.length+1)*100)+'%';
 const items=[['home','🏠',s('home'),''],...LS.map((l,i)=>['l'+i,l.ic,ltitle(l),prog['l'+i]?prog['l'+i].best+'/'+prog['l'+i].total:'']),['final','🏆',s('final'),prog.final?prog.final.best+'/'+prog.final.total:'']];
 $('#nav').innerHTML=items.map(it=>`<button class="${page===it[0]?'on':''}" onclick="go('${it[0]}')"><span>${it[1]}</span><span class="t">${it[2]}</span>${it[3]?`<span class="bd">${it[3]}</span>`:''}</button>`).join('');
 $('#main').innerHTML=page==='home'?homePage():page==='final'?finalPage():lessonPage(+page.slice(1));
}
render();
</script>
</body>
</html>
